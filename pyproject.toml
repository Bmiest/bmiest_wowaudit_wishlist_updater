[project]
name = "wishlist-updater"
version = "1.0.1"
description = "Generate QE Live upgrade reports from SimC and import them into WoWAudit wishlists."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Keep in lockstep with the mcr.microsoft.com/playwright/python image tag in
    # .github/workflows/update-wishlists.yml (the image ships the matching browser).
    "playwright==1.63.0",
]

[project.scripts]
wishlist-updater = "wishlist_updater.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wishlist_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real external sites (QE Live, WoWAudit, Blizzard); deselect with -m 'not live'",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

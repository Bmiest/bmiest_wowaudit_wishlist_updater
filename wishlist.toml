# Characters whose QE Live upgrade report gets pushed to the WoWAudit wishlist.
# QE Live's Upgrade Finder only supports healer specs.

# Where the SimC profile comes from when no /simc export is passed in:
#   "raiderio" -- public Raider.io API, no credentials needed (default)
#   "blizzard" -- Blizzard Profile API, needs BLIZZARD_CLIENT_ID / BLIZZARD_CLIENT_SECRET
simc_source = "raiderio"

# Dashboard crest planner: one extra report-only QE run (gear at its current level) that
# estimates what spending crests on each equipped item would gain.
crest_planner = true

# Upload on raid days only (UTC weekdays): the wishlist is fresh for the raid, and WoWAudit
# gets few uploads. The morning run (06:00-09:00 UTC) uploads; the 12:00 UTC catch-up run on
# these days only uploads if the morning didn't. Other days still build the dashboard reports.
# A pasted /simc export or force_upload always uploads.
upload_days = ["Wednesday", "Sunday"]

# Only these difficulties are uploaded to WoWAudit (fewer uploads). The other reports in
# [qe] raid_difficulty are still generated for the dashboard.
upload_difficulties = ["Mythic"]

# Team page used for keyless imports with your own login session (WOWAUDIT_SESSION).
wowaudit_team_url = "https://wowaudit.com/guild/eu/draenor/kelderklasse/teams/main"

[qe]
raid_difficulty = ["Heroic", "Mythic"]  # user test 2026-09-22: Heroic shown next to Mythic
mplus_level = 10
crafted_ilvl = 331
catalyst_limit = 4
# Guild droptimizer parity (raid lead, 2026-09): no sockets, equipped gear at max upgrade
# (QE's "Upgrade ALL to Max Level" ~ Raidbots "Match Droptimizer Item Levels").
auto_gem = false
upgrade_all_to_max = true

[[characters]]
name = "Shiftheal"
realm = "ragnaros"
region = "eu"

# Catalysed tier pieces and crafted items carry stats the gear APIs don't expose.
# Refresh after catalysing a tier piece or equipping a new crafted item: paste an in-game
# /simc export into the workflow's manual-run form (Actions -> Run workflow -> simc), or run
#   uv run wishlist-updater --refresh-overrides my_simc_export.txt
[characters.item_overrides]
shoulder = { id = 271553, redirected_base_stats = 239031 }
chest = { id = 271558, redirected_base_stats = 268221 }
waist = { id = 239649, crafted_stats = [40, 36] }
legs = { id = 271554, redirected_base_stats = 268236 }
off_hand = { id = 245769, crafted_stats = [32, 40] }

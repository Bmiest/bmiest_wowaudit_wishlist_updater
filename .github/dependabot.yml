# Weekly update PRs for the Python dependencies (uv.lock) and the pinned Actions.
# Actions stay pinned to a commit SHA; Dependabot moves the SHA and its version comment.
# No workflow here runs on pull requests (on purpose), so run `uv run pytest` on an update PR
# before merging it. Security updates arrive as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

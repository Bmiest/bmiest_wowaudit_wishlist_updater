name: Deploy dashboard site

# Redeploys the GitHub Pages dashboard when the frontend (site/) changes on main,
# using the run history already on the dashboard-data branch. No pipeline run, so no
# extra QE reports or WoWAudit uploads. Push-only (no pull_request triggers).
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

# Same group as update-wishlists.yml, so two deploys never race.
concurrency:
  group: update-wishlists
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          rm -rf _site/data
          if git ls-remote --exit-code origin refs/heads/dashboard-data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin refs/heads/dashboard-data
            git archive FETCH_HEAD data | tar -x -C _site
          else
            mkdir -p _site/data
          fi
          find _site -maxdepth 2 | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

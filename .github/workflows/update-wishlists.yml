name: Update WoWAudit wishlists

# Only scheduled and manual triggers. Never add pull_request / pull_request_target:
# once this runs on the self-hosted homelab runner, that would let untrusted code
# execute on the homelab host with access to secrets.
on:
  schedule:
    # Daily; the jitter job below starts the real work at a random time between
    # 06:00 and 09:00 UTC, so the requests don't hit the same minute every day.
    # Only raid days (wishlist.toml upload_days) upload to WoWAudit.
    - cron: "0 6 * * *"
    # Raid-day catch-up (Wed, Sun; starts 12:00-15:00 UTC): uploads only if the morning
    # run didn't, so a failed morning upload is retried before the evening raid.
    - cron: "0 12 * * 0,3"
  workflow_dispatch:
    inputs:
      character:
        description: "Only this character (blank = all in wishlist.toml)"
        required: false
        default: ""
      simc:
        description: "Optional in-game /simc export: used for this run AND saved as the new item overrides (needs 'character')"
        required: false
        default: ""
      dry_run:
        description: "Generate QE reports but don't import into WoWAudit"
        type: boolean
        default: false
      force_upload:
        description: "Upload the upload_difficulties reports now, even on a non-raid day or if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

# No workflow-level concurrency: the jitter wait must not hold a lock, or a manual run
# started during it would queue for hours. The jobs that need exclusivity lock themselves.

jobs:
  # Scheduled runs only: wait a random 0-180 min, so the daily run starts between 06:00
  # and 09:00 UTC and the raid-day catch-up between 12:00 and 15:00 UTC.
  jitter:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Random start within 3 hours of the scheduled time
        run: |
          delay=$(( $(od -An -N2 -tu2 /dev/urandom | tr -d ' ') % 10800 ))
          echo "Starting in $(( delay / 60 )) min"
          sleep "$delay"

  update:
    needs: jitter
    # Runs after the jitter wait on schedules, and straight away on manual runs.
    if: ${{ !cancelled() && (needs.jitter.result == 'success' || needs.jitter.result == 'skipped') }}
    concurrency:
      group: update-wishlists-update
      cancel-in-progress: false
    # GitHub-hosted by default. To move to the homelab runner, set the repo variable
    # RUNS_ON to a JSON label list, e.g. ["self-hosted","linux"].
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # The Playwright image ships Chromium plus its system deps, so the runner host
    # needs only Docker. The tag must match the playwright pin in pyproject.toml.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init --ipc=host
    env:
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        # Container jobs default to sh (dash), which lacks arrays and pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv sync --locked --no-dev

      # What was last uploaded, so an unchanged report isn't uploaded again (WoWAudit asked
      # for fewer uploads). Kept in the Actions cache: private, unlike the dashboard data.
      # A missing or evicted cache just means the next reports get uploaded.
      - name: Restore upload state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/upload-state
          key: upload-state-${{ github.run_id }}
          restore-keys: upload-state-

      - name: Update wishlists
        env:
          # WoWAudit import: the team API key if you have one, otherwise your own login
          # session (from `wishlist-updater --wowaudit-login`). Neither = report only.
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
          WOWAUDIT_SESSION: ${{ secrets.WOWAUDIT_SESSION }}
          # Optional: RAIDERIO_API_KEY only raises the rate limit; the Blizzard pair
          # is only needed when wishlist.toml sets simc_source = "blizzard".
          RAIDERIO_API_KEY: ${{ secrets.RAIDERIO_API_KEY }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Inputs go through env vars, never ${{ }} inside the script (injection).
          INPUT_CHARACTER: ${{ inputs.character }}
          INPUT_SIMC: ${{ inputs.simc }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE_UPLOAD: ${{ inputs.force_upload }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_CHARACTER:-}" ]; then args+=(--character "$INPUT_CHARACTER"); fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ "${INPUT_FORCE_UPLOAD:-false}" = "true" ]; then args+=(--force-upload); fi
          args+=(--upload-state "$RUNNER_TEMP/upload-state/upload-state.json")
          if [ -n "${INPUT_SIMC:-}" ]; then
            printf '%s\n' "$INPUT_SIMC" > "$RUNNER_TEMP/simc.txt"
            args+=(--simc-file "$RUNNER_TEMP/simc.txt")
          fi
          uv run --no-sync wishlist-updater --summary-json "$RUNNER_TEMP/summary.json" "${args[@]}"

      # hashFiles() only sees the workspace, so check the temp file explicitly.
      - name: Check upload state
        id: upload-state
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/upload-state/upload-state.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save upload state
        if: ${{ !cancelled() && steps.upload-state.outputs.exists == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/upload-state
          key: upload-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-summary
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qe-debug-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # A pasted /simc export also refreshes the catalyst / crafted-stat overrides in
  # wishlist.toml, so later Raider.io runs stay accurate. Pure data: no browser, no
  # external sites, and the only job allowed to push to main.
  save-overrides:
    needs: update
    if: ${{ !cancelled() && inputs.simc != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Refresh item overrides
        env:
          INPUT_SIMC: ${{ inputs.simc }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INPUT_SIMC" > "$RUNNER_TEMP/simc.txt"
          uv run --no-dev wishlist-updater --refresh-overrides "$RUNNER_TEMP/simc.txt"
          if ! git diff --quiet -- wishlist.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Refresh item overrides from /simc export (run $GITHUB_RUN_ID)" -- wishlist.toml
            git pull -q --rebase origin main  # main may have moved during the run
            git push -q origin HEAD:main
          fi

  # Records the run (also a failed one) on the dashboard-data branch; only public data is in
  # the summary (see summary.py). deploy-site.yml then deploys the site when this workflow
  # completes, so there is exactly one deploy path.
  record:
    needs: update
    if: ${{ !cancelled() && needs.update.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    permissions:
      contents: write # push to the dashboard-data branch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a run that crashed early has no summary
        with:
          name: run-summary
          path: ${{ runner.temp }}/summary

      - name: Add run to dashboard history
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          git ls-remote --exit-code origin refs/heads/dashboard-data >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/dashboard-data
            git worktree add --detach "$RUNNER_TEMP/history" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then # the branch doesn't exist yet: start it
            git worktree add --detach "$RUNNER_TEMP/history"
            git -C "$RUNNER_TEMP/history" checkout -q --orphan dashboard-data-init
            git -C "$RUNNER_TEMP/history" rm -rfq .
          else
            echo "::error::Could not query the dashboard-data branch (git exit $status)"
            exit 1
          fi
          PYTHONPATH=src python3 -m wishlist_updater.dashboard \
            "$RUNNER_TEMP/summary/summary.json" "$RUNNER_TEMP/history/data"
          cd "$RUNNER_TEMP/history"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -qm "Dashboard data for run $GITHUB_RUN_ID"
            git push -q origin HEAD:refs/heads/dashboard-data
          fi

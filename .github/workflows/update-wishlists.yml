name: Update WoWAudit wishlists

# Only scheduled and manual triggers. Never add pull_request / pull_request_target:
# once this runs on the self-hosted homelab runner, that would let untrusted code
# execute on the homelab host with access to secrets.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC, after most profiles have refreshed
  workflow_dispatch:
    inputs:
      character:
        description: "Only this character (blank = all in wishlist.toml)"
        required: false
        default: ""
      simc:
        description: "Optional in-game /simc export: used for this run AND saved as the new item overrides (needs 'character')"
        required: false
        default: ""
      dry_run:
        description: "Generate QE reports but don't import into WoWAudit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-wishlists
  cancel-in-progress: false

jobs:
  update:
    # GitHub-hosted by default. To move to the homelab runner, set the repo variable
    # RUNS_ON to a JSON label list, e.g. ["self-hosted","linux"].
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # The Playwright image ships Chromium plus its system deps, so the runner host
    # needs only Docker. The tag must match the playwright pin in pyproject.toml.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init --ipc=host
    env:
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        # Container jobs default to sh (dash), which lacks arrays and pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv sync --locked --no-dev

      - name: Update wishlists
        env:
          # WoWAudit import: the team API key if you have one, otherwise your own login
          # session (from `wishlist-updater --wowaudit-login`). Neither = report only.
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
          WOWAUDIT_SESSION: ${{ secrets.WOWAUDIT_SESSION }}
          # Optional: RAIDERIO_API_KEY only raises the rate limit; the Blizzard pair
          # is only needed when wishlist.toml sets simc_source = "blizzard".
          RAIDERIO_API_KEY: ${{ secrets.RAIDERIO_API_KEY }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Inputs go through env vars, never ${{ }} inside the script (injection).
          INPUT_CHARACTER: ${{ inputs.character }}
          INPUT_SIMC: ${{ inputs.simc }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_CHARACTER:-}" ]; then args+=(--character "$INPUT_CHARACTER"); fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${INPUT_SIMC:-}" ]; then
            printf '%s\n' "$INPUT_SIMC" > "$RUNNER_TEMP/simc.txt"
            args+=(--simc-file "$RUNNER_TEMP/simc.txt")
          fi
          uv run --no-sync wishlist-updater --summary-json "$RUNNER_TEMP/summary.json" "${args[@]}"

      - name: Upload run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-summary
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qe-debug-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # A pasted /simc export also refreshes the catalyst / crafted-stat overrides in
  # wishlist.toml, so later Raider.io runs stay accurate. Pure data: no browser, no
  # external sites, and the only job allowed to push to main.
  save-overrides:
    needs: update
    if: ${{ !cancelled() && inputs.simc != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Refresh item overrides
        env:
          INPUT_SIMC: ${{ inputs.simc }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INPUT_SIMC" > "$RUNNER_TEMP/simc.txt"
          uv run --no-dev wishlist-updater --refresh-overrides "$RUNNER_TEMP/simc.txt"
          if ! git diff --quiet -- wishlist.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Refresh item overrides from /simc export (run $GITHUB_RUN_ID)" -- wishlist.toml
            git pull -q --rebase origin main  # main may have moved during the run
            git push -q origin HEAD:main
          fi

  # Publishes the run (also a failed one) to the GitHub Pages dashboard. History lives on
  # the dashboard-data branch; only public data is in the summary (see summary.py).
  publish:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to the dashboard-data branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a run that crashed early has no summary
        with:
          name: run-summary
          path: ${{ runner.temp }}/summary

      - name: Add run to dashboard history
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/dashboard-data >/dev/null 2>&1; then
            git fetch --depth=1 origin refs/heads/dashboard-data
            git worktree add --detach "$RUNNER_TEMP/history" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/history"
            git -C "$RUNNER_TEMP/history" checkout -q --orphan dashboard-data-init
            git -C "$RUNNER_TEMP/history" rm -rfq .
          fi
          PYTHONPATH=src python3 -m wishlist_updater.dashboard \
            "$RUNNER_TEMP/summary/summary.json" "$RUNNER_TEMP/history/data"
          cd "$RUNNER_TEMP/history"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -qm "Dashboard data for run $GITHUB_RUN_ID"
            git push -q origin HEAD:refs/heads/dashboard-data
          fi

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d site ]; then cp -r site/. _site/; fi
          rm -rf _site/data
          cp -r "$RUNNER_TEMP/history/data" _site/data

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
